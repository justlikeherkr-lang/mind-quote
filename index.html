<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마음 한 줄 명언</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600&display=swap">
<style>
/* Layout: 상단에 큰 감정 버튼 4개(모바일 2x2, 넓은 화면 1x4), 아래에 명언 카드 한 장 */
:root {
  --bg: #F3F4F1;
  --surface: #FFFFFF;
  --ink: #26302E;
  --muted: #5B6764;
  --line: #D6DCD8;
  --joy-soft: #F6EBD3;   --joy-deep: #7E5A1A;
  --sad-soft: #DCE8F3;   --sad-deep: #3A5F80;
  --tired-soft: #DDEBE1; --tired-deep: #38644D;
  --anx-soft: #E7E3F3;   --anx-deep: #594F8C;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-quote: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171B1D; --surface: #20262A; --ink: #E8ECEA; --muted: #A5B0AC; --line: #343C40;
    --joy-soft: #3A3322;   --joy-deep: #E6C47E;
    --sad-soft: #22313E;   --sad-deep: #9EC2E2;
    --tired-soft: #23352A; --tired-deep: #A1D2B5;
    --anx-soft: #2E2A41;   --anx-deep: #C4BBEC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171B1D; --surface: #20262A; --ink: #E8ECEA; --muted: #A5B0AC; --line: #343C40;
  --joy-soft: #3A3322;   --joy-deep: #E6C47E;
  --sad-soft: #22313E;   --sad-deep: #9EC2E2;
  --tired-soft: #23352A; --tired-deep: #A1D2B5;
  --anx-soft: #2E2A41;   --anx-deep: #C4BBEC;
  color-scheme: dark;
}

* { box-sizing: border-box; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.6;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 24px; }

header { display: grid; gap: 6px; }
h1 {
  margin: 0;
  font-family: var(--font-quote);
  font-size: clamp(1.6rem, 4.5vw, 2.1rem);
  font-weight: 600;
  text-wrap: balance;
}
.lead { margin: 0; font-size: clamp(1.1rem, 3vw, 1.3rem); color: var(--muted); }

/* 감정 버튼 */
.moods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 820px) { .moods { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.mood {
  appearance: none;
  font: inherit;
  color: var(--ink);
  background: var(--soft);
  border: 3px solid transparent;
  border-radius: 18px;
  min-height: 104px;
  padding: 14px 10px;
  display: grid;
  place-content: center;
  gap: 2px;
  text-align: center;
  font-size: clamp(1.3rem, 4.2vw, 1.55rem);
  font-weight: 700;
  line-height: 1.3;
  cursor: pointer;
  transition: border-color .2s, transform .15s;
}
.mood span { display: block; }
.mood:hover { border-color: var(--deep); }
.mood:active { transform: scale(.98); }
.mood[aria-pressed="true"] { border-color: var(--deep); box-shadow: inset 0 0 0 2px var(--deep); }
.mood:focus-visible, .next:focus-visible { outline: 4px solid var(--deep, var(--ink)); outline-offset: 3px; }

.b-joy   { --soft: var(--joy-soft);   --deep: var(--joy-deep); }
.b-sad   { --soft: var(--sad-soft);   --deep: var(--sad-deep); }
.b-tired { --soft: var(--tired-soft); --deep: var(--tired-deep); }
.b-anx   { --soft: var(--anx-soft);   --deep: var(--anx-deep); }

/* 명언 카드 */
.card {
  background: var(--soft, var(--surface));
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: clamp(24px, 6vw, 48px) clamp(20px, 5vw, 44px);
  display: grid;
  gap: 22px;
  min-height: 320px;
  align-content: center;
}
.card[data-emotion="joy"]   { --soft: var(--joy-soft);   --deep: var(--joy-deep); }
.card[data-emotion="sad"]   { --soft: var(--sad-soft);   --deep: var(--sad-deep); }
.card[data-emotion="tired"] { --soft: var(--tired-soft); --deep: var(--tired-deep); }
.card[data-emotion="anx"]   { --soft: var(--anx-soft);   --deep: var(--anx-deep); }

.tag { margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--deep, var(--muted)); letter-spacing: .02em; }
.quote {
  margin: 0;
  font-family: var(--font-quote);
  font-weight: 500;
  font-size: clamp(1.6rem, 5vw, 2.4rem);
  line-height: 1.7;
  word-break: keep-all;
  overflow-wrap: break-word;
  text-wrap: pretty;
  transition: opacity .35s ease;
}
.quote.fade { opacity: 0; }
.author { margin: 0; font-size: clamp(1.15rem, 3.4vw, 1.4rem); font-weight: 500; color: var(--deep, var(--muted)); }
.author:empty { display: none; }

.next {
  appearance: none;
  font: inherit;
  font-size: clamp(1.2rem, 3.6vw, 1.4rem);
  font-weight: 700;
  justify-self: start;
  min-height: 64px;
  padding: 14px 32px;
  border-radius: 999px;
  border: 3px solid var(--deep);
  background: var(--surface);
  color: var(--deep);
  cursor: pointer;
}
.next:hover { background: var(--deep); color: var(--surface); }
@media (max-width: 520px) { .next { justify-self: stretch; } }

.note { margin: 0; font-size: .95rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .quote, .mood { transition: none; }
}
</style>
</head>

<div class="wrap">
  <header>
    <h1>마음 한 줄 명언</h1>

  </header>

  </div>

  <section class="card" id="card" data-emotion="" aria-live="polite">
    <p class="tag" id="tag">오늘의 한마디</p>
    <p class="quote" id="quote">오늘 마음은 어떠신가요? 위의 버튼 중 지금 마음과 가까운 것을 눌러 보세요.</p>
    <p class="author" id="author"></p>
    <button class="next" id="next" hidden>다른 명언 보기</button>
  </section>

  <p class="note">명언은 전해 내려오는 말을 우리말로 옮긴 것입니다.</p>
</div>

      ["인생에 대해 배운 모든 것은 한마디로 줄일 수 있다. 삶은 계속된다.", "로버트 프로스트"]
    ]
  }
};

var card = document.getElementById("card");
var tagEl = document.getElementById("tag");
var quoteEl = document.getElementById("quote");
var authorEl = document.getElementById("author");
var nextBtn = document.getElementById("next");
var buttons = document.querySelectorAll(".mood");
var current = null;
var bags = {};
var lastShown = {};

function refill(key) {
  var n = DATA[key].items.length;
  var idx = [];
  for (var i = 0; i < n; i++) idx.push(i);
  for (var j = n - 1; j > 0; j--) {
    var k = Math.floor(Math.random() * (j + 1));
    var t = idx[j]; idx[j] = idx[k]; idx[k] = t;
  }
  // 새로 섞은 뒤 첫 명언이 직전 명언과 같지 않게 한다
  if (idx[idx.length - 1] === lastShown[key] && n > 1) {
    var s = idx[0]; idx[0] = idx[idx.length - 1]; idx[idx.length - 1] = s;
  }
  bags[key] = idx;
}

function pick(key) {
  if (!bags[key] || bags[key].length === 0) refill(key);
  var i = bags[key].pop();
  lastShown[key] = i;
  return DATA[key].items[i];
}

function show(key) {
  var q = pick(key);
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var apply = function () {
    card.setAttribute("data-emotion", key);
    tagEl.textContent = DATA[key].tag;
    quoteEl.textContent = q[0];
    authorEl.textContent = "― " + q[1];
    nextBtn.hidden = false;
    quoteEl.classList.remove("fade");
  };
  if (reduce) { apply(); return; }
  quoteEl.classList.add("fade");
  setTimeout(apply, 250);
}

buttons.forEach(function (b) {
  b.addEventListener("click", function () {
    current = b.getAttribute("data-key");
    buttons.forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    show(current);
  });
});
nextBtn.addEventListener("click", function () { if (current) show(current); });
</script>

</body>
</html>
